# ==============================================================
# HashMeterAi — Rust package manifest
#
# Backend for a local-first AI coding token meter.
# Tauri v2 + vanilla JS frontend.
# ==============================================================

[package]
name        = "hashmeterai"
version     = "0.1.0"
description = "HashMeterAi — local-first AI coding token meter"
authors     = ["HashMeterAi"]
edition     = "2021"
rust-version = "1.77.2"

[lib]
name       = "hashmeterai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
# Core Tauri framework
tauri = { version = "2", features = ["config-json5"] }

# Plugins
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Remembers the window position + size across launches.
tauri-plugin-window-state = "2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time + timezone
chrono = { version = "0.4", features = ["serde"] }

# Home dir / paths cross-platform
dirs = "5"

# Parallel scanning
rayon = "1"

# Walking source directories
walkdir = "2"
